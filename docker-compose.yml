version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    container_name: my_postgres
    environment:
      POSTGRES_DB: coffe_db
      POSTGRES_USER: dasha
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
