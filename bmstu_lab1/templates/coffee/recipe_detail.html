<!-- recipe_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Рецепт кофе</title>
</head>
<body>
    <h1>Текущий рецепт</h1>

    {% if recipe %}
        <ul>
            {% for item in recipe.values %}
                <li>
                    <h3>{{ item.name }}</h3>
                    <img src="{{ item.image_url }}" alt="{{ item.name }}" width="150">
                    <p>Цена: {{ item.price }} / {{ item.unit }}</p>
                    <p>{{ item.description }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Вы ещё не добавили ни одного ингредиента.</p>
    {% endif %}

    <p><a href="{% url 'ingredients_list' %}">Назад к ингредиентам</a></p>
</body>
</html>
