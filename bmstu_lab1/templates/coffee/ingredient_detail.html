<!-- ingredient_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ ingredient.name }}</title>
</head>
<body>
    <h1>{{ ingredient.name }}</h1>
    <img src="{{ ingredient.image_url }}" alt="{{ ingredient.name }}" width="250">
    <p><strong>Цена:</strong> {{ ingredient.price }} / {{ ingredient.unit }}</p>
    <p><strong>Описание:</strong> {{ ingredient.description }}</p>

    <form method="post" action="{% url 'add_to_recipe' ingredient.id %}">
        {% csrf_token %}
        <button type="submit">Добавить в рецепт</button>
    </form>

    <p><a href="{% url 'ingredients_list' %}">Назад к списку</a></p>
</body>
</html>
