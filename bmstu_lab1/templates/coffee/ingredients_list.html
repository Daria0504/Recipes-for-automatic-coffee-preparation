{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ингредиенты для кофе</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <form method="get" class="search-bar">
                <input type="text" name="search" placeholder="Поиск" value="{{ search_query }}">
                <button type="submit">🔍</button>
            </form>
            <a href="{% url 'recipe_detail' %}" class="recipe-button">Рецепты кофе</a>
        </div>

        <div class="ingredients-grid">
            {% for ingredient in ingredients %}
                <div class="ingredient-card">
                    <img src="{{ ingredient.image_url }}" alt="{{ ingredient.name }}">
                    <div class="ingredient-info">
                        <h3>{{ ingredient.name }}</h3>
                        <p>{{ ingredient.price }} / {{ ingredient.unit }}</p>
                        <form method="post" action="{% url 'add_to_recipe' ingredient.id %}">
                            {% csrf_token %}
                            <button type="submit">Добавить</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <footer>
        <div class="recipe-counter">
            {{ recipe_count }}
        </div>
    </footer>
</body>
</html>
