{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Наши рецепты кофе</h1>

    <form method="get" class="mb-4">
        <input type="text" name="search" placeholder="Поиск рецептов..." value="{{ search_query }}">
        <button type="submit" class="btn btn-primary">Найти</button>
    </form>

    <div class="row">
        {% for recipe in recipes %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ recipe.image_url }}" class="card-img-top" alt="{{ recipe.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ recipe.name }}</h5>
                    <p class="card-text">{{ recipe.description }}</p>
                    <p class="text-muted">
                        Цена: {{ recipe.price|default:recipe.calculated_price }} ₽
                    </p>
                </div>
                <div class="card-footer">
                    <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-info">Подробнее</a>
                    <a href="{% url 'add_to_cart' 'recipe' recipe.id %}" class="btn btn-success">В корзину</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
